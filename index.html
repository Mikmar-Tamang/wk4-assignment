<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Custom Image Slider Library built with vanilla JavaScript">
  <title>Image Slider Library — Vanilla JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PAGE HEADER -->
  <header class="page-header">
    <h1>Image Slider Library</h1>
    <p>A custom carousel built from scratch with vanilla JavaScript</p>
  </header>

  <!-- SLIDER COMPONENT -->
  <section class="slider" aria-label="Image slider">

    <!-- Viewport Mask (overflow: hidden) -->
    <div class="slider-viewport">

      <!-- Sliding Track (flex row of images) -->
      <div class="slider-track">

        <div class="slide">
          <img src="./Images/desertEagle.webp" alt="Desert Eagle handgun">
        </div>

        <div class="slide">
          <img src="./Images/woodpeaker.webp" alt="Woodpecker handgun">
        </div>

        <div class="slide">
          <img src="./Images/ump.webp" alt="UMP submachine gun">
        </div>

        <div class="slide">
          <img src="./Images/m1887.webp" alt="M1887 lever-action shotgun">
        </div>

        <div class="slide">
          <img src="./Images/m1014.jpg" alt="M1014 combat shotgun">
        </div>

      </div>
    </div>

    <!-- Navigation Arrows -->
    <button class="slider-btn prev" aria-label="Previous slide">&#10094;</button>
    <button class="slider-btn next" aria-label="Next slide">&#10095;</button>

    <!-- Indicator Dots (generated by JS) -->
    <div class="slider-dots" aria-label="Slide indicators"></div>

  </section>

  <!-- PAGE FOOTER -->
  <footer class="page-footer">
    <p>Built by Mikmar Lyal Singh Tamang | Vanilla JavaScript Slider</p>
  </footer>

  <!-- CONNECT JAVASCRIPT -->
  <script src="slider.js"></script>

</body>
</html>
